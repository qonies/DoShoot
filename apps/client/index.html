<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 触屏适配（FR-U6）：禁缩放防误触双击、viewport-fit=cover 暴露刘海安全区 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DoShoot</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- HUD（FR-U1/U4：DOM 分层；M1 新增血条/弹药/换弹/击杀流/准星/重生界面） -->
    <div id="hud" class="hidden">
      <div id="fps">-- FPS</div>
      <canvas id="minimap" width="150" height="150"></canvas>
      <div id="hint"></div>
      <div id="topbar">
        <span data-i18n="hud.kills"></span>
        <b id="killCount">0</b>
      </div>
      <div id="killfeed"></div>
      <div id="crosshair">
        <span class="l"></span><span class="r"></span><span class="u"></span><span class="d"></span><span class="dot"></span>
        <div id="hitmarker"><span></span><span></span></div>
      </div>
      <div id="floaters"></div>
      <div id="healthwrap">
        <div id="healthbar"><div id="healthfill"></div></div>
        <span id="hptext">100</span>
      </div>
      <div id="weaponwrap">
        <div id="weaponname"></div>
        <div id="ammo"><b id="ammoMag">--</b><span id="ammoReserve"> / --</span></div>
        <div id="reloadbar" class="hidden"><div id="reloadfill"></div></div>
        <div id="reloadtext" class="hidden" data-i18n="hud.reloading"></div>
      </div>
      <div id="respawn" class="hidden">
        <div id="respawnKiller"></div>
        <div id="respawnTimer"></div>
      </div>
      <div id="matchTimer" class="hidden"></div>
      <div id="scoreboard" class="hidden">
        <h3 data-i18n="sb.title"></h3>
        <table>
          <thead><tr><th data-i18n="sb.player"></th><th data-i18n="sb.kills"></th><th data-i18n="sb.deaths"></th></tr></thead>
          <tbody id="sbBody"></tbody>
        </table>
      </div>
      <div id="unlockBanner" class="hidden"><span id="unlockText"></span></div>
      <div id="settlement" class="hidden">
        <div class="panel">
          <h2 data-i18n="settle.title"></h2>
          <div id="settleReason"></div>
          <table>
            <thead><tr><th data-i18n="sb.player"></th><th data-i18n="sb.kills"></th><th data-i18n="sb.deaths"></th></tr></thead>
            <tbody id="settleBody"></tbody>
          </table>
          <div class="sbtns">
            <button id="leaveBtn" data-i18n="settle.leave"></button>
            <button id="rematchBtn" class="primary" data-i18n="settle.rematch"></button>
          </div>
        </div>
      </div>
      <!-- 设置面板（FR-L5，M4）：Esc 开关；改动即时生效并持久化 -->
      <div id="settings" class="hidden">
        <div class="panel">
          <h2 data-i18n="set.title"></h2>
          <label><span data-i18n="set.volume"></span><input id="setVolume" type="range" min="0" max="100" step="1" /></label>
          <label><span data-i18n="set.bgm"></span><input id="setBgm" type="range" min="0" max="100" step="1" /></label>
          <label>
            <span data-i18n="set.quality"></span>
            <select id="setQuality">
              <option value="low" data-i18n="set.qLow"></option>
              <option value="medium" data-i18n="set.qMed"></option>
              <option value="high" data-i18n="set.qHigh"></option>
            </select>
          </label>
          <label>
            <span data-i18n="set.lang"></span>
            <select id="setLang">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <!-- 触屏操作模式（FR-U6 双模式，v0.3.8）：仅触屏设备显示（CSS body:not(.touch) 隐藏） -->
          <label id="touchModeRow">
            <span data-i18n="set.touchMode"></span>
            <select id="setTouchMode">
              <option value="pad" data-i18n="touch.modePad"></option>
              <option value="stick" data-i18n="touch.modeStick"></option>
            </select>
          </label>
          <button id="setClose" data-i18n="set.close"></button>
        </div>
      </div>
      <div id="vignette"></div>
    </div>

    <!-- 连接状态提示（M2 进房/断线） -->
    <div id="netmsg" class="hidden"></div>

    <!-- 大厅（FR-L1/L2/L3/L5/L6） -->
    <div id="lobby">
      <div class="panel">
        <h1>DoShoot</h1>
        <label>
          <span data-i18n="nickname"></span>
          <input id="nickname" maxlength="16" autocomplete="off" />
        </label>
        <label>
          <span data-i18n="mode"></span>
          <select id="mode">
            <option value="ffa">FFA</option>
            <option value="tdm" disabled data-i18n="modeTdm">TDM (V2)</option>
            <option value="hardpoint" disabled data-i18n="modeHardpoint">Hardpoint (V2)</option>
          </select>
        </label>
        <label>
          <span data-i18n="map"></span>
          <select id="map"></select>
        </label>
        <label>
          <span data-i18n="difficulty"></span>
          <select id="difficulty">
            <option value="easy" data-i18n="diff.easy"></option>
            <option value="normal" selected data-i18n="diff.normal"></option>
            <option value="hard" data-i18n="diff.hard"></option>
          </select>
        </label>
        <label>
          <span data-i18n="killTarget"></span>
          <select id="killTarget">
            <option value="30" selected data-i18n="rule.kills30"></option>
            <option value="50" data-i18n="rule.kills50"></option>
            <option value="100" data-i18n="rule.kills100"></option>
          </select>
        </label>
        <label>
          <span data-i18n="timeLimit"></span>
          <select id="timeLimit">
            <option value="300" selected data-i18n="rule.time5"></option>
            <option value="480" data-i18n="rule.time8"></option>
            <option value="600" data-i18n="rule.time10"></option>
          </select>
        </label>
        <label>
          <span data-i18n="roomCode"></span>
          <input id="roomCode" maxlength="7" inputmode="numeric" autocomplete="off" placeholder="0000" />
        </label>
        <div class="buttons">
          <button id="quickJoin" data-i18n="quickJoin"></button>
          <button id="start" class="primary" data-i18n="createRoom"></button>
        </div>
        <div class="buttons">
          <button id="joinRoom" data-i18n="joinRoom"></button>
        </div>
        <button id="langBtn" class="lang"></button>
      </div>
    </div>

    <!-- 等待房间（FR-L8）：新建游戏后等待局域网玩家加入；房主可调参数、开局/离开 -->
    <div id="waitroom" class="hidden">
      <div class="panel">
        <h2 data-i18n="wait.title"></h2>
        <div class="codebox">
          <span class="codelabel" data-i18n="wait.code"></span>
          <b id="waitCode">----</b>
        </div>
        <div id="waitShare" class="shareHint"></div>
        <div class="waitMeta">
          <span data-i18n="wait.players"></span>
          <b id="waitCount">1 / 10</b>
        </div>
        <div id="waitPlayers"></div>
        <label>
          <span data-i18n="map"></span>
          <select id="waitMap"></select>
        </label>
        <label>
          <span data-i18n="difficulty"></span>
          <select id="waitDifficulty"></select>
        </label>
        <label>
          <span data-i18n="killTarget"></span>
          <select id="waitKillTarget"></select>
        </label>
        <label>
          <span data-i18n="timeLimit"></span>
          <select id="waitTimeLimit"></select>
        </label>
        <label>
          <span data-i18n="botCount"></span>
          <select id="waitBotCount"></select>
        </label>
        <div id="waitHostHint" class="shareHint hidden" data-i18n="wait.readonly"></div>
        <div class="buttons">
          <button id="waitLeave" data-i18n="wait.leave"></button>
          <button id="waitStart" class="primary" data-i18n="wait.start"></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
